name: RAG domain tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_graph_rag_domain.py' -v
      - run: python -m unittest discover -s tests -p 'test_rag_persistence.py' -v
